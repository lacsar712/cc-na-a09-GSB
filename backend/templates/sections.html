{% extends "base.html" %}
{% block body %}
<h1>水道区段</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<table>
  <thead><tr><th>区段名称</th><th>标称亮度下限</th><th>已贴记录</th><th>维护人</th></tr></thead>
  <tbody>
  {% for s in sections %}
    <tr>
      <td>{{ s.name }}</td>
      <td>{{ s.min_cd }}</td>
      <td>{{ s.tagged_count }}</td>
      <td>{{ s.created_by }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="4">还没有区段</td></tr>
  {% endfor %}
  </tbody>
</table>
{% if can_write %}
<form class="card" method="post">
  {% csrf_token %}
  <label>区段名称</label>
  <input name="name" />
  <label>标称亮度下限（坎德拉）</label>
  <input name="min_cd" type="number" step="0.1" />
  <button type="submit">新建区段</button>
</form>
{% endif %}
{% endblock %}
